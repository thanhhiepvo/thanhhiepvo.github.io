<section class="header">
  <div class="row">
    <div class="three columns">
      <a href="{{ site.baseurl }}/">
        <img class="u-max-full-width" src='{{ site.baseurl }}{{ site.data.main_info.profile_pic }}' alt="{{ site.data.main_info.name }}">
      </a>
    </div>
    <div class="nine columns main-description">
      <h1>{{ site.data.main_info.name }}</h1>
      <p>{{ site.data.main_info.title }}</p>
      <p>{{ site.data.main_info.email }}</p>
      <p>{% include social-links.html %}</p>
    </div>
  </div>
</section>
